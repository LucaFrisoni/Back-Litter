# Tests every push and only deploys main to Render when they pass, then confirms the deploy went live.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the deploy hook
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing the RENDER_DEPLOY_HOOK_URL repository secret"
            exit 1
          fi
      - name: Deploy this commit
        run: curl --silent --show-error --fail --max-time 60 --request POST "$RENDER_DEPLOY_HOOK_URL&ref=$GITHUB_SHA" --output /dev/null
      - name: Wait for the new version
        run: bash .github/scripts/wait-for-render.sh https://backlitter.onrender.com "$GITHUB_SHA"
